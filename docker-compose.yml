services:
  sync:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: "postgresql://fluxa:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/fluxa_sync"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env to at least 32 random characters}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-true}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      ACCESS_TOKEN_TTL_SECONDS: "3600"
      AUTH_REQUESTS_PER_MINUTE: "10"
      SYNC_REQUESTS_PER_MINUTE: "120"
      SYNC_EVENT_RETENTION_DAYS: "${SYNC_EVENT_RETENTION_DAYS:-30}"
      DATABASE_MAX_CONNECTIONS: "10"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluxa
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: fluxa_sync
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxa -d fluxa_sync"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
