services:
  sync:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://fluxa:fluxa@postgres:5432/fluxa_sync
      JWT_SECRET: change-this-to-a-long-random-secret
      RUST_LOG: info
      SYNC_EVENT_RETENTION_DAYS: 90
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluxa
      POSTGRES_PASSWORD: fluxa
      POSTGRES_DB: fluxa_sync
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxa -d fluxa_sync"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
